services:
  db:
    image: postgres:16-alpine
    container_name: dayflow-db
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
